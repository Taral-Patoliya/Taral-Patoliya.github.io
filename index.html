<style>

<script type="module">
import * as THREE from 'three';

const WIDTH = 1080, HEIGHT = 1920;
window.DURATION = 20;

const stageEl = document.getElementById('stage');
const fitStage = () => { stageEl.style.transform = `scale(${Math.min(window.innerWidth / WIDTH, window.innerHeight / HEIGHT)})`; };
fitStage();
window.addEventListener('resize', fitStage);

const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
const easeOutCubic = (t) => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const easeOutQuart = (t) => 1 - Math.pow(1 - clamp(t, 0, 1), 4);
const easeInOutCubic = (t) => { const x = clamp(t, 0, 1); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const easeOutBackSoft = (t) => { const x = clamp(t, 0, 1), c1 = 1.15, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };

function sampleStops(stops, t, out) {
  if (t <= stops[0].t) return out.copy(stops[0].c);
  if (t >= stops[stops.length - 1].t) return out.copy(stops[stops.length - 1].c);
  for (let i = 0; i < stops.length - 1; i++) {
    if (t >= stops[i].t && t <= stops[i + 1].t) {
      return out.copy(stops[i].c).lerp(stops[i + 1].c, smoothstep(stops[i].t, stops[i + 1].t, t));
    }
  }
  return out.copy(stops[0].c);
}

function mulberry32(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, powerPreference: 'high-performance', preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(WIDTH, HEIGHT, false);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf2d9be);
scene.fog = new THREE.FogExp2(0xf2d9be, 0.00085);
const camera = new THREE.PerspectiveCamera(37, WIDTH / HEIGHT, 2, 2200);

// Dynamic Morning -> Daylight -> Golden Hour -> Night Sky Dome
const skyGeo = new THREE.SphereGeometry(1650, 32, 20);
const skyPos = skyGeo.attributes.position;
skyGeo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(skyPos.count * 3), 3));
scene.add(new THREE.Mesh(skyGeo, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide, depthWrite: false, fog: false })));

const SKY = {
  zenith:  [{ t:0, c:new THREE.Color(0x88adc7) }, { t:5.5, c:new THREE.Color(0x74a3c7) }, { t:11.5, c:new THREE.Color(0x5c7ea3) }, { t:14.5, c:new THREE.Color(0x3a4e73) }, { t:17.5, c:new THREE.Color(0x131f33) }, { t:20, c:new THREE.Color(0x0b1322) }],
  mid:     [{ t:0, c:new THREE.Color(0xe6ccb2) }, { t:5.5, c:new THREE.Color(0xd6e1e8) }, { t:11.5, c:new THREE.Color(0xebb07a) }, { t:14.5, c:new THREE.Color(0xd97d54) }, { t:17.5, c:new THREE.Color(0x283a54) }, { t:20, c:new THREE.Color(0x152338) }],
  horizon: [{ t:0, c:new THREE.Color(0xf7d7b2) }, { t:5.5, c:new THREE.Color(0xebeae4) }, { t:11.5, c:new THREE.Color(0xffbe73) }, { t:14.5, c:new THREE.Color(0xf5924c) }, { t:17.5, c:new THREE.Color(0x3b4963) }, { t:20, c:new THREE.Color(0x1c2b40) }],
  glow:    [{ t:0, c:new THREE.Color(0xffe1b5) }, { t:5.5, c:new THREE.Color(0xfff5e6) }, { t:11.5, c:new THREE.Color(0xffca80) }, { t:14.5, c:new THREE.Color(0xff9442) }, { t:17.5, c:new THREE.Color(0x6e5566) }, { t:20, c:new THREE.Color(0x1c2b40) }]
};
const cZen = new THREE.Color(), cMid = new THREE.Color(), cHor = new THREE.Color(), cGlo = new THREE.Color(), cOut = new THREE.Color();
const sDir = new THREE.Vector3(), vDir = new THREE.Vector3();

function updateSky(t, sunPos) {
  sampleStops(SKY.zenith, t, cZen); sampleStops(SKY.mid, t, cMid);
  sampleStops(SKY.horizon, t, cHor); sampleStops(SKY.glow, t, cGlo);
  sDir.copy(sunPos).normalize();
  const attr = skyGeo.attributes.color, arr = attr.array;
  for (let i = 0; i < skyPos.count; i++) {
    const vx = skyPos.getX(i), vy = skyPos.getY(i), vz = skyPos.getZ(i), yn = vy / 1650;
    if (yn >= 0) {
      cOut.copy(cHor).lerp(cMid, smoothstep(0, 0.24, yn)).lerp(cZen, Math.pow(clamp((yn - 0.12) / 0.88, 0, 1), 0.78));
    } else cOut.copy(cHor);
    vDir.set(vx, vy, vz).normalize();
    const d = Math.max(0, vDir.dot(sDir));
    cOut.lerp(cGlo, Math.pow(d, 4) * (1 - smoothstep(0, 0.55, Math.abs(yn))) * 0.65);
    arr[i * 3] = cOut.r; arr[i * 3 + 1] = cOut.g; arr[i * 3 + 2] = cOut.b;
  }
  attr.needsUpdate = true;
  scene.background.copy(cHor);
  scene.fog.color.copy(cHor);
}

// Procedural Equirectangular Environment Reflection Map (golden sky, clouds, skyline & harbour)
(function setupEnvMap() {
  const w = 1024, h = 512, c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0.00, '#5c8cb8'); g.addColorStop(0.26, '#9fc0d9');
  g.addColorStop(0.42, '#f5cfa3'); g.addColorStop(0.49, '#ffad66');
  g.addColorStop(0.51, '#1e7882'); g.addColorStop(0.75, '#155861'); g.addColorStop(1.00, '#0f3f47');
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);

  const rng = mulberry32(9021);
  for (let i = 0; i < 65; i++) {
    const cx = rng() * w, cy = 45 + rng() * 175, rx = 28 + rng() * 75, ry = 8 + rng() * 18;
    const cg = ctx.createRadialGradient(cx, cy - ry * 0.2, 2, cx, cy, rx);
    cg.addColorStop(0, 'rgba(255,246,232,0.72)'); cg.addColorStop(0.55, 'rgba(255,224,188,0.34)'); cg.addColorStop(1, 'rgba(255,224,188,0)');
    ctx.fillStyle = cg; ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
  }
  const sg = ctx.createRadialGradient(w * 0.68, h * 0.48, 4, w * 0.68, h * 0.48, 130);
  sg.addColorStop(0, 'rgba(255,250,235,0.98)'); sg.addColorStop(0.25, 'rgba(255,205,130,0.72)'); sg.addColorStop(1, 'rgba(255,180,100,0)');
  ctx.fillStyle = sg; ctx.fillRect(0, 0, w, h);

  ctx.fillStyle = 'rgba(224,212,198,0.75)';
  for (let x = 0; x < w; x += 18) { const bh = 6 + rng() * 16; ctx.fillRect(x, h * 0.50 - bh, 14, bh); }
  ctx.fillStyle = 'rgba(255,228,184,0.26)';
  for (let i = 0; i < 90; i++) ctx.fillRect(rng() * w, h * 0.52 + rng() * (h * 0.42), 16 + rng() * 54, 2);

  const tex = new THREE.CanvasTexture(c);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromEquirectangular(tex).texture;
  tex.dispose(); pmrem.dispose();
})();

// Lights
const hemiLight = new THREE.HemisphereLight(0xfff1de, 0xc9b9a8, 1.15);
scene.add(hemiLight);

const sunLight = new THREE.DirectionalLight(0xffdfb8, 2.25);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(2048, 2048);
sunLight.shadow.camera.near = 40; sunLight.shadow.camera.far = 780;
sunLight.shadow.camera.left = -225; sunLight.shadow.camera.right = 225;
sunLight.shadow.camera.top = 225; sunLight.shadow.camera.bottom = -225;
sunLight.shadow.bias = -0.0004; sunLight.shadow.normalBias = 0.035;
scene.add(sunLight);

const fillLight = new THREE.DirectionalLight(0xd4e2f2, 0.55);
fillLight.position.set(-160, 180, -140);
scene.add(fillLight);

const towerUplight = new THREE.PointLight(0xffc982, 0, 260, 1.3);
towerUplight.position.set(36, 48, 36);
scene.add(towerUplight);

// Procedural Textures
const concreteTex = (() => {
  const c = document.createElement('canvas'); c.width = 256; c.height = 512;
  const ctx = c.getContext('2d'); ctx.fillStyle = '#cfc9c0'; ctx.fillRect(0, 0, 256, 512);
  for (let y = 0; y < 512; y += 16) { ctx.fillStyle = y % 32 === 0 ? 'rgba(98,92,86,0.2)' : 'rgba(255,250,242,0.16)'; ctx.fillRect(0, y, 256, 2); }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(3, 18); t.colorSpace = THREE.SRGBColorSpace;
  return t;
})();

const waterNormalTex = (() => {
  const c = document.createElement('canvas'); c.width = 256; c.height = 256;
  const ctx = c.getContext('2d'), img = ctx.createImageData(256, 256);
  for (let y = 0; y < 256; y++) for (let x = 0; x < 256; x++) {
    const u = (x / 256) * Math.PI * 2, v = (y / 256) * Math.PI * 2, idx = (y * 256 + x) * 4;
    img.data[idx] = Math.floor(((Math.sin(u * 4 + Math.cos(v * 3)) * 0.22 + Math.cos(u * 9 - v * 6) * 0.12) * 0.5 + 0.5) * 255);
    img.data[idx + 1] = Math.floor(((Math.cos(v * 5 + Math.sin(u * 4)) * 0.22 + Math.sin(u * 7 + v * 8) * 0.12) * 0.5 + 0.5) * 255);
    img.data[idx + 2] = 245; img.data[idx + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(28, 28);
  return t;
})();

const glassTex = (() => {
  const w = 512, h = 128, panes = 32, pw = w / panes;
  const nc = document.createElement('canvas'); nc.width = w; nc.height = h;
  const nctx = nc.getContext('2d'), img = nctx.createImageData(w, h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const px = (x % pw) / pw, seam = px < 0.08 || px > 0.92, idx = (y * w + x) * 4;
    img.data[idx] = Math.floor(((seam ? 0 : (px - 0.5) * 0.22) * 0.5 + 0.5) * 255);
    img.data[idx + 1] = Math.floor((((y / h - 0.5) * 0.14) * 0.5 + 0.5) * 255);
    img.data[idx + 2] = 250; img.data[idx + 3] = 255;
  }
  nctx.putImageData(img, 0, 0);
  const normalMap = new THREE.CanvasTexture(nc); normalMap.wrapS = normalMap.wrapT = THREE.RepeatWrapping; normalMap.repeat.set(2, 1);

  const ec = document.createElement('canvas'); ec.width = w; ec.height = h;
  const ectx = ec.getContext('2d'); ectx.fillStyle = '#000'; ectx.fillRect(0, 0, w, h);
  const rng = mulberry32(7712);
  for (let p = 0; p < panes; p++) if (rng() > 0.36) {
    ectx.globalAlpha = 0.55 + rng() * 0.45; ectx.fillStyle = rng() > 0.4 ? '#ffca7a' : '#ffe4b5';
    ectx.fillRect(p * pw + 2, 10, pw - 4, h - 20);
  }
  const emissiveMap = new THREE.CanvasTexture(ec); emissiveMap.wrapS = emissiveMap.wrapT = THREE.RepeatWrapping; emissiveMap.repeat.set(2, 1); emissiveMap.colorSpace = THREE.SRGBColorSpace;
  return { normalMap, emissiveMap };
})();

// Materials
const M = {
  water: new THREE.MeshStandardMaterial({ color: 0x1b7982, roughness: 0.18, metalness: 0.16, normalMap: waterNormalTex, normalScale: new THREE.Vector2(0.32, 0.32), envMapIntensity: 1.15 }),
  shallow: new THREE.MeshStandardMaterial({ color: 0x2a979e, roughness: 0.32, transparent: true, opacity: 0.42 }),
  plazaWhite: new THREE.MeshStandardMaterial({ color: 0xf7f3ec, roughness: 0.80 }),
  plazaStone: new THREE.MeshStandardMaterial({ color: 0xe8e1d7, roughness: 0.84 }),
  road: new THREE.MeshStandardMaterial({ color: 0xc9c6c1, roughness: 0.88 }),
  park: new THREE.MeshStandardMaterial({ color: 0xaabfa8, roughness: 0.90 }),
  treeSage: new THREE.MeshStandardMaterial({ color: 0x7ea186, roughness: 0.82, flatShading: true }),
  treeGold: new THREE.MeshStandardMaterial({ color: 0xc29b6b, roughness: 0.82, flatShading: true }),
  walls: [
    new THREE.MeshStandardMaterial({ color: 0xf7f3eb, roughness: 0.72 }),
    new THREE.MeshStandardMaterial({ color: 0xe7dccb, roughness: 0.76 }),
    new THREE.MeshStandardMaterial({ color: 0xd49677, roughness: 0.78 }),
    new THREE.MeshStandardMaterial({ color: 0xa4b5a6, roughness: 0.78 }),
    new THREE.MeshStandardMaterial({ color: 0xdfc196, roughness: 0.76 }),
    new THREE.MeshStandardMaterial({ color: 0xcfa497, roughness: 0.78 }),
    new THREE.MeshStandardMaterial({ color: 0x747e88, roughness: 0.74 })
  ],
  roofDark: new THREE.MeshStandardMaterial({ color: 0x475059, roughness: 0.82 }),
  roofCopper: new THREE.MeshStandardMaterial({ color: 0x75948a, roughness: 0.62, metalness: 0.25 }),
  cityWin: new THREE.MeshPhysicalMaterial({ color: 0x3b4954, roughness: 0.12, metalness: 0.72, clearcoat: 1, clearcoatRoughness: 0.08, normalMap: glassTex.normalMap, normalScale: new THREE.Vector2(0.45, 0.45), envMapIntensity: 1.65, emissive: new THREE.Color(0xffbe63), emissiveMap: glassTex.emissiveMap, emissiveIntensity: 0 }),
  boat: new THREE.MeshStandardMaterial({ color: 0xfffcf7, roughness: 0.35 }),
  core: new THREE.MeshStandardMaterial({ map: concreteTex, color: 0xd4cec4, roughness: 0.82 }),
  cladding: new THREE.MeshStandardMaterial({ color: 0xfcf9f3, roughness: 0.32, metalness: 0.12, envMapIntensity: 0.85 }),
  torsoGlass: new THREE.MeshPhysicalMaterial({ color: 0x364652, roughness: 0.08, metalness: 0.85, clearcoat: 1, clearcoatRoughness: 0.05, reflectivity: 1, normalMap: glassTex.normalMap, normalScale: new THREE.Vector2(0.55, 0.55), envMapIntensity: 1.95, emissive: new THREE.Color(0xffc570), emissiveMap: glassTex.emissiveMap, emissiveIntensity: 0 }),
  gap: new THREE.MeshStandardMaterial({ color: 0x262f38, roughness: 0.42, metalness: 0.60 }),
  spine: new THREE.MeshStandardMaterial({ color: 0xfffdf9, roughness: 0.22, metalness: 0.36, envMapIntensity: 1.05 }),
  joint: new THREE.MeshStandardMaterial({ color: 0xe3ddd3, roughness: 0.30, metalness: 0.46 }),
  lampBulb: new THREE.MeshBasicMaterial({ color: 0xffe0a3, transparent: true, opacity: 0 }),
  lampHalo: new THREE.MeshBasicMaterial({ color: 0xffcf75, transparent: true, opacity: 0, depthWrite: false }),
  beacon: new THREE.MeshBasicMaterial({ color: 0xff4b3a, transparent: true, opacity: 0 })
};

// Environment: Malmö Västra Hamnen with Varied Low-Poly Nordic Architecture
const cityGroup = new THREE.Group();
scene.add(cityGroup);
const boats = [];

(function buildCity() {
  const water = new THREE.Mesh(new THREE.PlaneGeometry(2400, 2400), M.water);
  water.rotation.x = -Math.PI / 2; water.position.y = -1.6; water.receiveShadow = true;
  cityGroup.add(water);

  const shallow = new THREE.Mesh(new THREE.PlaneGeometry(520, 520), M.shallow);
  shallow.rotation.x = -Math.PI / 2; shallow.position.set(-40, -1.52, 40);
  cityGroup.add(shallow);

  const addLand = (x, z, w, d, mat = M.plazaStone) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, 3.2, d), mat);
    m.position.set(x, -1.6, z); m.receiveShadow = m.castShadow = true; cityGroup.add(m);
    const r = new THREE.Mesh(new THREE.BoxGeometry(w + 0.6, 0.35, d + 0.6), M.plazaWhite);
    r.position.set(x, -0.16, z); r.receiveShadow = true; cityGroup.add(r);
  };
  addLand(230, -210, 552, 528); addLand(240, 320, 540, 464);
  addLand(-92, 145, 34, 210, M.plazaWhite); addLand(-70, 240, 80, 26, M.plazaWhite);

  [46, 165].forEach((bx) => {
    const deck = new THREE.Mesh(new THREE.BoxGeometry(14, 0.9, 38), M.plazaWhite);
    deck.position.set(bx, 1.1, 71); deck.castShadow = deck.receiveShadow = true; cityGroup.add(deck);
  });

  const pOut = new THREE.Mesh(new THREE.CylinderGeometry(42, 43, 0.28, 64), M.plazaWhite); pOut.position.y = 0.14; pOut.receiveShadow = true; cityGroup.add(pOut);

function createFloorShape(sc = 1) {
  const sh = new THREE.Shape();
  for (let i = 0; i <= 96; i++) {

    const r = (14 + 2.9 * Math.cos(th) + 1.35 * Math.cos(2 * th) - 0.65 * Math.cos(3 * th) + 0.22 * Math.cos(4 * th)) * sc;
    i === 0 ? sh.moveTo(r * Math.cos(th), r * Math.sin(th)) : sh.lineTo(r * Math.cos(th), r * Math.sin(th));
  }
  return sh;
}

function makeSlab(sh, h, mat) {
  const m = new THREE.Mesh(new THREE.ExtrudeGeometry(sh, { depth: h, bevelEnabled: false, curveSegments: 48 }), mat);

}

function strut(p1, p2, r, mat) {
  const dir = new THREE.Vector3().subVectors(p2, p1), len = dir.length();
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 12), mat);
  m.position.copy(p1).addScaledVector(dir, 0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
  m.castShadow = m.receiveShadow = true;
  return m;
}

  const el = document.createElement('div'); el.className = 'callout'; el.style.left = d.boxX + 'px'; el.style.top = d.boxY + 'px'; el.style.opacity = '0';
  el.innerHTML = `<div class="callout-tag">${d.tag}</div><div class="callout-title">${d.title}</div><div class="callout-desc">${d.desc}</div>`;
  labelsLayer.appendChild(el);
  const poly = document.createElementNS(SVG_NS, 'polyline');
  poly.setAttribute('fill', 'none'); poly.setAttribute('stroke', '#fff'); poly.setAttribute('stroke-width', '3.5'); poly.setAttribute('stroke-linecap', 'round'); poly.setAttribute('stroke-linejoin', 'round');
  leadersGroup.appendChild(poly);
  const ring = document.createElementNS(SVG_NS, 'circle'); ring.setAttribute('r', '13'); ring.setAttribute('fill', 'rgba(217,122,56,0.32)'); ring.setAttribute('stroke', '#fff'); ring.setAttribute('stroke-width', '2.5'); leadersGroup.appendChild(ring);
  const dot = document.createElementNS(SVG_NS, 'circle'); dot.setAttribute('r', '6'); dot.setAttribute('fill', '#fff'); leadersGroup.appendChild(dot);
  return { d, el, poly, ring, dot };
});

const headerEl = document.getElementById('header'), mainTitleEl = document.getElementById('main-title'), subTitleEl = document.getElementById('sub-title');
const eyebrowTextEl = document.getElementById('eyebrow-text'), eyebrowDotEl = document.getElementById('eyebrow-dot');
const hudH = document.getElementById('hud-height'), hudF = document.getElementById('hud-floors'), hudT = document.getElementById('hud-twist');
const projV = new THREE.Vector3();

// Time-of-Day Transition (Morning -> Daylight -> Golden Hour -> Night + City Lights)
const SUN_COL = [{ t:0, c:new THREE.Color(0xffd29e) }, { t:5.5, c:new THREE.Color(0xfff5e4) }, { t:11.5, c:new THREE.Color(0xffb463) }, { t:14.5, c:new THREE.Color(0xff8438) }, { t:17.5, c:new THREE.Color(0x5274a8) }, { t:20, c:new THREE.Color(0x46689c) }];
const HEM_SKY = [{ t:0, c:new THREE.Color(0xffe9cf) }, { t:5.5, c:new THREE.Color(0xfff8ed) }, { t:11.5, c:new THREE.Color(0xffcfa0) }, { t:14.5, c:new THREE.Color(0xf59d6c) }, { t:17.5, c:new THREE.Color(0x31496e) }, { t:20, c:new THREE.Color(0x1f3352) }];
const HEM_GND = [{ t:0, c:new THREE.Color(0xc9b6a3) }, { t:5.5, c:new THREE.Color(0xd1c7bc) }, { t:11.5, c:new THREE.Color(0xc49f82) }, { t:14.5, c:new THREE.Color(0x8c6858) }, { t:17.5, c:new THREE.Color(0x1c2738) }, { t:20, c:new THREE.Color(0x111926) }];
const SEA_COL = [{ t:0, c:new THREE.Color(0x1f7e85) }, { t:6.0, c:new THREE.Color(0x1b858e) }, { t:13.5, c:new THREE.Color(0x21717a) }, { t:17.5, c:new THREE.Color(0x114552) }, { t:20, c:new THREE.Color(0x0b313b) }];

function updateTimeOfDay(t) {
  const u = t / window.DURATION;
  const az = lerp(-0.55, 2.35, smoothstep(0, 0.82, u));
  const el = lerp(0.24, 0.96, Math.sin(clamp(u / 0.82, 0, 1) * Math.PI));
  sunLight.position.set(Math.cos(az) * Math.cos(el) * 340, Math.max(38, Math.sin(el) * 340), Math.sin(az) * Math.cos(el) * 340);

  updateSky(t, sunLight.position);
  sampleStops(SUN_COL, t, sunLight.color);
  sampleStops(HEM_SKY, t, hemiLight.color);
  sampleStops(HEM_GND, t, hemiLight.groundColor);
  sampleStops(SEA_COL, t, M.water.color);

  const night = smoothstep(15.2, 18.4, t);
  const golden = Math.sin(clamp((t - 10) / 6.2, 0, 1) * Math.PI);
  sunLight.intensity = lerp(2.25, 0.68, night) + golden * 0.35;
  hemiLight.intensity = lerp(1.15, 0.42, night);
  fillLight.intensity = lerp(0.55, 0.25, night);

  M.torsoGlass.envMapIntensity = lerp(1.95, 0.55, night) + golden * 0.45;
  M.cityWin.envMapIntensity = lerp(1.65, 0.45, night) + golden * 0.35;

  const lightsOn = smoothstep(15.6, 18.6, t);
  M.cityWin.emissiveIntensity = lightsOn * 1.45;
  M.torsoGlass.emissiveIntensity = lightsOn * 1.35;
  M.lampBulb.opacity = lightsOn * 0.96;
  M.lampHalo.opacity = lightsOn * 0.38;
  towerUplight.intensity = lightsOn * 4.2;
  M.beacon.opacity = lightsOn * (0.55 + 0.45 * Math.sin(t * 5));

  if (t < 5) { eyebrowTextEl.textContent = 'Malmö, Sweden • Morning'; eyebrowDotEl.style.background = '#d98a3c'; }
  else if (t < 10.5) { eyebrowTextEl.textContent = 'Malmö, Sweden • Daylight'; eyebrowDotEl.style.background = '#1b8a96'; }
  else if (t < 15.8) { eyebrowTextEl.textContent = 'Malmö, Sweden • Golden Hour'; eyebrowDotEl.style.background = '#e06d2b'; }
  else { eyebrowTextEl.textContent = 'Malmö, Sweden • Night'; eyebrowDotEl.style.background = '#f0a843'; }

  const darkSky = smoothstep(14.8, 17.4, t) > 0.5;
  mainTitleEl.style.color = darkSky ? '#ffffff' : '#1a222d';
  mainTitleEl.style.textShadow = darkSky ? '0 3px 22px rgba(8,14,24,0.85)' : '0 2px 18px rgba(255,248,238,0.82)';
  subTitleEl.style.color = darkSky ? '#e3d5c3' : '#3d4856';
  subTitleEl.style.textShadow = darkSky ? '0 2px 16px rgba(8,14,24,0.85)' : '0 1px 12px rgba(255,248,238,0.88)';
}

function renderFrame(tIn) {
  const t = clamp(Number(tIn) || 0, 0, window.DURATION);
  updateTimeOfDay(t);

  waterNormalTex.offset.set(t * 0.014, t * 0.009);
  for (let i = 0; i < boats.length; i++) {
    const b = boats[i];
    b.group.position.y = b.baseY + Math.sin(t * 1.6 + b.phase) * 0.09;
    b.group.rotation.z = Math.sin(t * 1.3 + b.phase) * 0.025;
  }

  const headP = easeOutCubic(t / 0.85);
  headerEl.style.opacity = headP.toFixed(4);
  headerEl.style.transform = `translate3d(0, ${(1 - headP) * -22}px, 0)`;

  const podP = easeOutCubic(clamp((t - 0.15) / 1.15, 0, 1));
  podiumGroup.visible = podP > 0.001; podiumGroup.scale.set(1, Math.max(0.001, podP), 1);
  siteRing.material.opacity = 0.75 * (1 - smoothstep(14.5, 16.5, t));

  const coreP = easeInOutCubic(clamp((t - 1.7) / 3.1, 0, 1));
  coreGroup.visible = coreP > 0.001; coreGroup.scale.set(1, Math.max(0.001, coreP), 1);

  let floors = Math.round(podP * 2), maxTwist = 0;
  for (let i = 0; i < NUM_CUBES; i++) {
    const it = segmentItems[i], st = 4.6 + i * 0.56;
    const dropP = easeOutCubic(clamp((t - st) / 0.95, 0, 1));
    const twistP = easeInOutCubic(clamp((t - (st + 0.18)) / 1.05, 0, 1));
    if (dropP <= 0.001) { it.group.visible = false; }
    else {
      it.group.visible = true;
      it.group.position.y = it.targetY + (1 - dropP) * 34;
      const sxz = 0.92 + 0.08 * easeOutBackSoft(dropP);
      it.group.scale.set(sxz, 0.85 + 0.15 * dropP, sxz);
      const ang = it.targetAngle * twistP;
      it.group.rotation.y = -ang;
      if (dropP > 0.4) floors += FLOORS_PER_CUBE + (i < 8 ? 1 : 0);
      maxTwist = Math.max(maxTwist, (ang * 180) / Math.PI);
    }
  }

  const crownP = easeOutCubic(clamp((t - 10.2) / 1.1, 0, 1));
  crownGroup.visible = crownP > 0.001;
  crownGroup.position.y = crownBaseY + (1 - crownP) * 24;
  crownGroup.scale.setScalar(0.94 + 0.06 * crownP);
  if (crownP > 0.5) floors = 54;

  const spineP = easeInOutCubic(clamp((t - 10.6) / 2.6, 0, 1));
  const butP = easeOutCubic(clamp((t - 10.4) / 0.9, 0, 1));
  buttress.visible = butP > 0.01; buttress.scale.set(1, Math.max(0.01, butP), 1); pad.visible = butP > 0.01;
  for (let s = 0; s < SPINE_SEGS; s++) {
    const lp = clamp((spineP - spineSegs[s].frac) * 18, 0, 1);
    spineSegs[s].mesh.visible = lp > 0.01; spineSegs[s].mesh.scale.set(lp, 1, lp);
  }
  for (let i = 0; i < NUM_CUBES; i++) {
    const tp = easeOutBackSoft(clamp((t - (11.2 + i * 0.34)) / 0.72, 0, 1));
    trusses[i].visible = tp > 0.01; trusses[i].scale.setScalar(Math.max(0.01, tp));
  }

  const arcVis = smoothstep(8.7, 9.4, t) * (1 - smoothstep(14.0, 14.6, t));
  twistArcGroup.visible = arcVis > 0.01; twistArcGroup.scale.setScalar(0.88 + 0.12 * arcVis); arcTube.material.opacity = 0.92 * arcVis;

  const rulVis = smoothstep(14.7, 15.4, t);
  rulerGroup.visible = rulVis > 0.01; rulerGroup.scale.set(1, Math.max(0.01, rulVis), 1);

  const orbitU = easeInOutCubic(t / window.DURATION);
  const az = lerp(0.52, 1.98, orbitU), rad = lerp(310, 342, Math.sin(orbitU * Math.PI * 0.85));
  camera.position.set(Math.cos(az) * rad, lerp(86, 154, easeInOutCubic(clamp(t / 18.5, 0, 1))), Math.sin(az) * rad);
  camera.lookAt(0, lerp(58, 93, easeInOutCubic(clamp(t / 16, 0, 1))), 0);
  camera.updateMatrixWorld();

  rulerGroup.position.set(Math.cos(az + Math.PI / 2) * 27, 0, Math.sin(az + Math.PI / 2) * 27);
  rulerGroup.rotation.y = -az;

  renderer.render(scene, camera);

  hudH.textContent = `${Math.round(Math.max(podP * 8, coreP * 188, crownP > 0 ? 188 + crownP * 2 : 0))} m`;
  hudF.textContent = `${clamp(floors, 0, 54)} / 54`;
  hudT.textContent = `${Math.round(maxTwist)}°`;

  for (let i = 0; i < widgets.length; i++) {
    const { d, el, poly, ring, dot } = widgets[i];
    const alpha = easeOutCubic(clamp((t - d.tIn) / (d.tPeak - d.tIn), 0, 1)) * (1 - smoothstep(d.tOutS, d.tOutE, t));
    projV.copy(d.anchor).project(camera);
    if (alpha <= 0.005 || projV.z >= 1) {
      el.style.opacity = poly.style.opacity = ring.style.opacity = dot.style.opacity = '0';
      continue;
    }
    const p0x = (projV.x * 0.5 + 0.5) * WIDTH, p0y = (-projV.y * 0.5 + 0.5) * HEIGHT;
    const slideY = (1 - easeOutCubic(clamp((t - d.tIn) / (d.tPeak - d.tIn), 0, 1))) * 16;
    el.style.opacity = alpha.toFixed(4); el.style.transform = `translate3d(0, ${slideY.toFixed(1)}px, 0)`;

    const edgeX = d.side === 'left' ? d.boxX + (el.offsetWidth || 350) : d.boxX;
    const edgeY = d.boxY + slideY + (el.offsetHeight || 124) * 0.5;
    const elbowX = d.side === 'left' ? edgeX + 34 : edgeX - 34;
    const ld = easeOutQuart(clamp((t - d.tIn) / 0.48, 0, 1));
    const p1x = lerp(p0x, elbowX, ld), p1y = lerp(p0y, edgeY, ld);
    const p2x = lerp(p1x, edgeX, clamp((ld - 0.55) / 0.45, 0, 1));

    poly.setAttribute('points', `${p0x.toFixed(1)},${p0y.toFixed(1)} ${p1x.toFixed(1)},${p1y.toFixed(1)} ${p2x.toFixed(1)},${p1y.toFixed(1)}`);
    ring.setAttribute('cx', p0x.toFixed(1)); ring.setAttribute('cy', p0y.toFixed(1));
    dot.setAttribute('cx', p0x.toFixed(1)); dot.setAttribute('cy', p0y.toFixed(1));
    poly.style.opacity = ring.style.opacity = dot.style.opacity = alpha.toFixed(4);
  }
}

let rafId = null, startTime = null, external = false;
function loop(now) {
  if (external) return;
  if (startTime === null) startTime = now;
  renderFrame(((now - startTime) / 1000) % window.DURATION);
  rafId = requestAnimationFrame(loop);
}
window.renderAt = (t) => { external = true; if (rafId) { cancelAnimationFrame(rafId); rafId = null; } renderFrame(t); };

renderFrame(0);
rafId = requestAnimationFrame(loop);
</script>
</body>
</html>
