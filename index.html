// Deterministic easing & math helpers
const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (edge0, edge1, x) => {
const t = clamp((x - edge0) / (edge1 - edge0), 0, 1);
return t * t * (3 - 2 * t);
};
const easeOutCubic = (t) => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const easeOutQuart = (t) => 1 - Math.pow(1 - clamp(t, 0, 1), 4);
const easeInOutCubic = (t) => {
const x = clamp(t, 0, 1);
return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
};
const easeOutBackSoft = (t) => {
const x = clamp(t, 0, 1);
const c1 = 1.15;
const c3 = c1 + 1;
return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
};
// Deterministic PRNG for city layout
function mulberry32(seed) {
let a = seed >>> 0;
return function() {
a |= 0;
a = (a + 0x6D2B79F5) | 0;
let t = Math.imul(a ^ (a >>> 15), 1 | a);
t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
};
}

function createSkyDome() {
const skyGeo = new THREE.SphereGeometry(1650, 32, 20);
const pos = skyGeo.attributes.position;
const colors = new Float32Array(pos.count * 3);
const topCol = new THREE.Color(0xc5dbea);
const midCol = new THREE.Color(0xdfeaf2);
const botCol = new THREE.Color(0xeef4f8);
const tmp = new THREE.Color();
for (let i = 0; i < pos.count; i++) {
const y = pos.getY(i) / 1650;
if (y >= 0) {
tmp.copy(midCol).lerp(topCol, Math.pow(y, 0.72));
} else {
tmp.copy(midCol).lerp(botCol, clamp(-y * 4, 0, 1));
}
colors[i * 3] = tmp.r;
colors[i * 3 + 1] = tmp.g;
colors[i * 3 + 2] = tmp.b;
}
skyGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
const skyMat = new THREE.MeshBasicMaterial({
vertexColors: true,
side: THREE.BackSide,
depthWrite: false,
fog: false
});
return new THREE.Mesh(skyGeo, skyMat);
}

for (let i = 0; i < pos.count; i++) {
const y = pos.getY(i) / 50;
if (y > 0.05) c.copy(horC).lerp(skyC, clamp(y, 0, 1));
else if (y > -0.05) c.copy(horC);
else c.copy(horC).lerp(seaC, clamp(-y * 2.5, 0, 1));
cols[i * 3] = c.r;
cols[i * 3 + 1] = c.g;
cols[i * 3 + 2] = c.b;
}
envGeo.setAttribute('color', new THREE.BufferAttribute(cols, 3));
envScene.add(new THREE.Mesh(envGeo, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide })));
const rt = pmrem.fromScene(envScene, 0.04);
scene.environment = rt.texture;
envGeo.dispose();
pmrem.dispose();

function createConcreteTexture() {
const c = document.createElement('canvas');
c.width = 256;
c.height = 512;
const ctx = c.getContext('2d');
ctx.fillStyle = '#b4bcc4';
ctx.fillRect(0, 0, 256, 512);
for (let y = 0; y < 512; y += 16) {
ctx.fillStyle = y % 32 === 0 ? 'rgba(90, 102, 114, 0.22)' : 'rgba(255, 255, 255, 0.14)';
ctx.fillRect(0, y, 256, 2);
}
ctx.fillStyle = 'rgba(72, 84, 96, 0.28)';
for (let y = 8; y < 512; y += 32) {
for (let x = 16; x < 256; x += 32) {
ctx.beginPath();
ctx.arc(x, y, 1.6, 0, Math.PI * 2);
ctx.fill();
}
}
const tex = new THREE.CanvasTexture(c);
tex.wrapS = THREE.RepeatWrapping;
tex.wrapT = THREE.RepeatWrapping;
tex.repeat.set(3, 18);
tex.colorSpace = THREE.SRGBColorSpace;
return tex;
}
function createWaterNormalTexture() {
const c = document.createElement('canvas');
c.width = 256;
c.height = 256;
const ctx = c.getContext('2d');
const img = ctx.createImageData(256, 256);
for (let y = 0; y < 256; y++) {
for (let x = 0; x < 256; x++) {
const u = (x / 256) * Math.PI * 2;
const v = (y / 256) * Math.PI * 2;
const nx = Math.sin(u * 4 + Math.cos(v * 3)) * 0.22 + Math.cos(u * 9 - v * 6) * 0.12;
const ny = Math.cos(v * 5 + Math.sin(u * 4)) * 0.22 + Math.sin(u * 7 + v * 8) * 0.12;
const idx = (y * 256 + x) * 4;
img.data[idx] = Math.floor((nx * 0.5 + 0.5) * 255);
img.data[idx + 1] = Math.floor((ny * 0.5 + 0.5) * 255);
img.data[idx + 2] = 245;
img.data[idx + 3] = 255;
}
}
ctx.putImageData(img, 0, 0);
const tex = new THREE.CanvasTexture(c);
tex.wrapS = THREE.RepeatWrapping;
tex.wrapT = THREE.RepeatWrapping;
tex.repeat.set(28, 28);
return tex;
}

el.innerHTML = <div class="callout-tag">${def.tag}</div> <div class="callout-title">${def.title}</div> <div class="callout-desc">${def.desc}</div>;
labelsLayer.appendChild(el);
const poly = document.createElementNS(SVG_NS, 'polyline');
poly.setAttribute('fill', 'none');
poly.setAttribute('stroke', '#ffffff');
poly.setAttribute('stroke-width', '3.5');
poly.setAttribute('stroke-linecap', 'round');
poly.setAttribute('stroke-linejoin', 'round');
leadersGroup.appendChild(poly);
const outerRing = document.createElementNS(SVG_NS, 'circle');
outerRing.setAttribute('r', '13');
outerRing.setAttribute('fill', 'rgba(27, 138, 150, 0.28)');
outerRing.setAttribute('stroke', '#ffffff');
outerRing.setAttribute('stroke-width', '2.5');
leadersGroup.appendChild(outerRing);
const innerDot = document.createElementNS(SVG_NS, 'circle');
innerDot.setAttribute('r', '6');
innerDot.setAttribute('fill', '#ffffff');
leadersGroup.appendChild(innerDot);
return { def, el, poly, outerRing, innerDot };
});
const headerEl = document.getElementById('header');
const hudHeightEl = document.getElementById('hud-height');
const hudFloorsEl = document.getElementById('hud-floors');
const hudTwistEl = document.getElementById('hud-twist');
const projVec = new THREE.Vector3();
function projectToScreen(vec3) {
projVec.copy(vec3).project(camera);
return {
x: (projVec.x * 0.5 + 0.5) * WIDTH,
y: (-projVec.y * 0.5 + 0.5) * HEIGHT,
visible: projVec.z < 1
};
}
// ============================================================================
// DETERMINISTIC FRAME RENDERER: window.renderAt(t)
// ============================================================================
function renderAt(tInput) {
const t = clamp(Number(tInput) || 0, 0, window.DURATION);
// 1. Subtle ambient life (harbour water shimmer & gently bobbing boats)
waterNormalTex.offset.set(t * 0.014, t * 0.009);
for (let i = 0; i < boats.length; i++) {
const b = boats[i];
b.group.position.y = b.baseY + Math.sin(t * 1.6 + b.phase) * 0.09;
b.group.rotation.z = Math.sin(t * 1.3 + b.phase) * 0.025;
}
// 2. Title Header entrance (0.0s -> 0.85s)
const headP = easeOutCubic(t / 0.85);
headerEl.style.opacity = headP.toFixed(4);
headerEl.style.transform = translate3d(0, ${(1 - headP) * -22}px, 0);
// 3. Stage 1: Foundation Site Ring & Entrance Podium (0.0s -> 1.8s)
const podP = easeOutCubic(clamp((t - 0.15) / 1.15, 0, 1));
podiumGroup.visible = podP > 0.001;
podiumGroup.scale.set(1, Math.max(0.001, podP), 1);
siteRing.material.opacity = 0.75 * (1 - smoothstep(14.5, 16.5, t));
// 4. Stage 2: Central Concrete Core Extrusion (1.7s -> 4.9s)
const coreP = easeInOutCubic(clamp((t - 1.7) / 3.1, 0, 1));
coreGroup.visible = coreP > 0.001;
coreGroup.scale.set(1, Math.max(0.001, coreP), 1);
// 5. Stage 3: 9 Stacked Cubes Dropping In & Twisting 0° -> 90° (4.6s -> 10.6s)
let activeFloors = Math.round(podP * 2);
let currentMaxTwistDeg = 0;
for (let i = 0; i < NUM_CUBES; i++) {
const item = segmentItems[i];
const startT = 4.6 + i * 0.56;
const dropP = easeOutCubic(clamp((t - startT) / 0.95, 0, 1));
const twistP = easeInOutCubic(clamp((t - (startT + 0.18)) / 1.05, 0, 1));
if (dropP <= 0.001) {
item.group.visible = false;
} else {
item.group.visible = true;
const dropOffset = (1 - dropP) * 34;
item.group.position.y = item.targetY + dropOffset;
const scaleXZ = 0.92 + 0.08 * easeOutBackSoft(dropP);
item.group.scale.set(scaleXZ, 0.85 + 0.15 * dropP, scaleXZ);
const angle = item.targetAngle * twistP;
item.group.rotation.y = -angle;
if (dropP > 0.4) {
activeFloors += FLOORS_PER_CUBE + (i < 8 ? 1 : 0);
}
const deg = (angle * 180) / Math.PI;
if (deg > currentMaxTwistDeg) currentMaxTwistDeg = deg;
}
}
// 6. Stage 4: Crown & 190m Pinnacle (10.2s -> 11.6s)
const crownP = easeOutCubic(clamp((t - 10.2) / 1.1, 0, 1));
crownGroup.visible = crownP > 0.001;
crownGroup.position.y = crownBaseY + (1 - crownP) * 24;
crownGroup.scale.setScalar(0.94 + 0.06 * crownP);
if (crownP > 0.5) activeFloors = 54;
// 7. Stage 5: External White Steel Spine & 9 Triangular Trusses (10.6s -> 15.0s)
const spineGrowP = easeInOutCubic(clamp((t - 10.6) / 2.6, 0, 1));
const buttressP = easeOutCubic(clamp((t - 10.4) / 0.9, 0, 1));
buttressStrut.visible = buttressP > 0.01;
buttressStrut.scale.set(1, Math.max(0.01, buttressP), 1);
foundationPad.visible = buttressP > 0.01;
for (let s = 0; s < SPINE_SEGS; s++) {
const seg = spineTubeSegments[s];
const localP = clamp((spineGrowP - seg.frac) * 18, 0, 1);
seg.mesh.visible = localP > 0.01;
seg.mesh.scale.set(localP, 1, localP);
}
for (let i = 0; i < NUM_CUBES; i++) {
const tr = outriggerTrusses[i];
const trStart = 11.2 + i * 0.34;
const trP = easeOutBackSoft(clamp((t - trStart) / 0.72, 0, 1));
tr.group.visible = trP > 0.01;
tr.group.scale.setScalar(Math.max(0.01, trP));
}
// 8. Architectural 3D Diagrams (90° Twist Arc & 190m Dimension Line)
const arcVis = smoothstep(8.7, 9.4, t) * (1 - smoothstep(14.0, 14.6, t));
twistArcGroup.visible = arcVis > 0.01;
twistArcGroup.scale.setScalar(0.88 + 0.12 * arcVis);
arcTube.material.opacity = 0.92 * arcVis;
const rulerVis = smoothstep(14.7, 15.4, t);
heightRulerGroup.visible = rulerVis > 0.01;
heightRulerGroup.scale.set(1, Math.max(0.01, rulerVis), 1);
// 9. Cinematic Slowly Orbiting Aerial Camera
// Sweeps smoothly around the SE -> S -> SW quadrant so the twisting cubes & spine stay framed
const orbitU = easeInOutCubic(t / window.DURATION);
const azimuth = lerp(0.52, 1.98, orbitU); // ~30 deg to ~113 deg
const radius = lerp(310, 342, Math.sin(orbitU * Math.PI * 0.85));
const camY = lerp(86, 154, easeInOutCubic(clamp(t / 18.5, 0, 1)));
const targetY = lerp(58, 93, easeInOutCubic(clamp(t / 16.0, 0, 1)));
camera.position.set(
Math.cos(azimuth) * radius,
camY,
Math.sin(azimuth) * radius
);
camera.lookAt(0, targetY, 0);
camera.updateMatrixWorld();
// Keep 190m ruler oriented nicely to the left side of the tower in screen view
const perpAngle = azimuth + Math.PI / 2;
heightRulerGroup.position.set(Math.cos(perpAngle) * 27, 0, Math.sin(perpAngle) * 27);
heightRulerGroup.rotation.y = -azimuth;
// 10. Render 3D Frame
renderer.render(scene, camera);
// 11. Update Bottom Architectural Spec HUD
const dispHeight = Math.round(
Math.max(
podP * 8,
coreP * 188,
crownP > 0 ? 188 + crownP * 2 : 0
)
);
hudHeightEl.textContent = ${dispHeight} m;
hudFloorsEl.textContent = ${clamp(activeFloors, 0, 54)} / 54;
hudTwistEl.textContent = ${Math.round(currentMaxTwistDeg)}°;
// 12. Update HTML Callout Labels & SVG Leader Lines
for (let i = 0; i < labelWidgets.length; i++) {
const w = labelWidgets[i];
const d = w.def;
const fadeIn = easeOutCubic(clamp((t - d.tIn) / (d.tPeak - d.tIn), 0, 1));
const fadeOut = 1 - smoothstep(d.tOutStart, d.tOutEnd, t);
const alpha = fadeIn * fadeOut;
if (alpha <= 0.005) {
w.el.style.opacity = '0';
w.poly.style.opacity = '0';
w.outerRing.style.opacity = '0';
w.innerDot.style.opacity = '0';
continue;
}
const pt = projectToScreen(d.anchor);
if (!pt.visible) {
w.el.style.opacity = '0';
w.poly.style.opacity = '0';
w.outerRing.style.opacity = '0';
w.innerDot.style.opacity = '0';
continue;
}
const slideY = (1 - fadeIn) * 16;
w.el.style.opacity = alpha.toFixed(4);
w.el.style.transform = translate3d(0, ${slideY.toFixed(1)}px, 0);
const boxW = w.el.offsetWidth || 350;
const boxH = w.el.offsetHeight || 124;
const edgeX = d.side === 'left' ? d.boxX + boxW : d.boxX;
const edgeY = d.boxY + slideY + boxH * 0.5;
const elbowX = d.side === 'left' ? edgeX + 34 : edgeX - 34;
// Animated leader line draw from anchor point to callout edge
const lineDraw = easeOutQuart(clamp((t - d.tIn) / 0.48, 0, 1));
const p0x = pt.x;
const p0y = pt.y;
const p1x = lerp(p0x, elbowX, lineDraw);
const p1y = lerp(p0y, edgeY, lineDraw);
const p2x = lerp(p1x, edgeX, clamp((lineDraw - 0.55) / 0.45, 0, 1));
const p2y = p1y;
w.poly.setAttribute('points', ${p0x.toFixed(1)},${p0y.toFixed(1)} ${p1x.toFixed(1)},${p1y.toFixed(1)} ${p2x.toFixed(1)},${p2y.toFixed(1)});
w.poly.style.opacity = alpha.toFixed(4);
w.outerRing.setAttribute('cx', p0x.toFixed(1));
w.outerRing.setAttribute('cy', p0y.toFixed(1));
w.outerRing.style.opacity = alpha.toFixed(4);
w.innerDot.setAttribute('cx', p0x.toFixed(1));
w.innerDot.setAttribute('cy', p0y.toFixed(1));
w.innerDot.style.opacity = alpha.toFixed(4);
}
}
window.renderAt = renderAt;
// Render initial frame at t = 0 deterministically
renderAt(0);
</script>
</body>
</html>
